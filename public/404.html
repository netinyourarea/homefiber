<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Fiber Connection</title>
    <script>
      // GitHub Pages SPA redirect — preserve the path so the router handles it
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/?p=" +
          encodeURIComponent(l.pathname + l.search) +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
